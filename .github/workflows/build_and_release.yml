name: Build & Release StripX v3

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows Application
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Unit Tests
        run: flutter test

      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows Release
        run: flutter build windows --release

      - name: Create Windows Release Zip
        run: |
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath build\stripx3v-windows.zip

      - name: Upload Windows Portable Zip
        uses: actions/upload-artifact@v4
        with:
          name: stripx3v-windows-zip
          path: build/stripx3v-windows.zip

      - name: Upload Windows Release Folder (Direct .exe and DLLs)
        uses: actions/upload-artifact@v4
        with:
          name: stripx3v-windows-binaries
          path: build/windows/x64/runner/Release/

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stripx3v-android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Publish GitHub Release
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: stripx3v-windows-zip
          path: artifacts

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: stripx3v-android
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/stripx3v-windows.zip
            artifacts/app-release.apk
            assets/version.json
          draft: false
          prerelease: false
          generate_release_notes: true
