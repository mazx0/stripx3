name: stripx3v
description: "StripX v3 - Ultra-lightweight cross-platform LED strip controller & host sync"
publish_to: 'none'
version: 3.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  http: ^1.6.0
  path_provider: ^2.1.6
  path: ^1.9.1
  package_info_plus: ^10.2.2
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  open_filex: ^5.0.0
  universal_ble: ^3.1.2
  record: ^7.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/version.json
